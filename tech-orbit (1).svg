<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="680" height="420" fill="#0d1117"/>

  <circle cx="340" cy="210" r="180" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 5"/>
