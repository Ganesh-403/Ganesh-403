name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Ganesh-403
          outputs: |
            assets/snake-light.svg?color_snake=%23f74c00&color_dots=%23fff3e0,%23fed7aa,%23fdba74,%23fb923c,%23ea580c
            assets/snake-dark.svg?palette=github-dark&color_snake=%23fbbf24&color_dots=%23161b22,%237c2d12,%23c2410c,%23f97316,%23fbbf24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit themed contribution animation
        run: |
          git add assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh themed contribution animation'
          git pull --rebase
          git push
