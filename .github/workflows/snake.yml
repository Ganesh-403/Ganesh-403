name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: Ganesh-403
          outputs: |
            assets/snake-light.svg?color_snake=%237c3aed&color_dots=%23ede9fe,%23c4b5fd,%23a78bfa,%238b5cf6,%236d28d9
            assets/snake-dark.svg?palette=github-dark&color_snake=%2367e8f9&color_dots=%231e1933,%234c1d95,%237c3aed,%23a78bfa,%23f9a8d4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit themed contribution animation
        run: |
          git add assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh themed contribution animation'
          git pull --rebase
          git push
