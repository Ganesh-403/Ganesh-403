<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-label="Animated terminal — whoami, building LeapView, and projects">
<title>Animated terminal — whoami, building LeapView, and projects</title>
<defs></defs>
<rect x="1" y="1" width="478" height="198" rx="22" fill="#0d1117" stroke="#30363d"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#f0f6fc"><style>
.scene{opacity:0;animation:cycle 15s infinite;animation-timing-function:steps(1,end)}
.scene0{opacity:1;animation-delay:0s}.scene1{animation-delay:5s}.scene2{animation-delay:10s}
@keyframes cycle{0%,32%{opacity:1}33%,100%{opacity:0}}
.cursor{animation:blink 1.2s steps(2,start) infinite}@keyframes blink{to{opacity:0}}
@media(prefers-reduced-motion:reduce){.scene,.cursor{animation:none}.scene0{opacity:1}.scene1,.scene2{opacity:0}}
</style><text x="24" y="32" font-size="16" fill="#a3b1c2" font-weight="400" >ganesh@github ~</text><g class="scene scene0"><text x="24" y="80" font-size="25" fill="#f07424" font-weight="650" font-family="monospace">$ whoami</text><text x="24" y="124" font-size="29" fill="#f0f6fc" font-weight="650" >Ganesh Kambli</text></g><g class="scene scene1"><text x="24" y="80" font-size="25" fill="#f07424" font-weight="650" font-family="monospace">$ building</text><text x="24" y="124" font-size="29" fill="#f0f6fc" font-weight="650" >LeapView</text></g><g class="scene scene2"><text x="24" y="80" font-size="25" fill="#f07424" font-weight="650" font-family="monospace">$ projects/</text><text x="24" y="124" font-size="29" fill="#f0f6fc" font-weight="650" >RepoSage / HoneyCloud</text></g><rect class="cursor" x="24" y="157" width="9" height="14" fill="#f07424"/></g>
</svg>
