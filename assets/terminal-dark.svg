<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-label="Animated terminal: whoami, currently building LeapView, and selected projects">
<title>Animated terminal: whoami, currently building LeapView, and selected projects</title>
<defs><style>
.scene{opacity:0;animation:cycle 15s infinite;animation-timing-function:steps(1,end)}
.scene0{opacity:1;animation-delay:0s}.scene1{animation-delay:5s}.scene2{animation-delay:10s}
@keyframes cycle{0%,32%{opacity:1}33%,100%{opacity:0}}
.cursor{animation:blink 1.2s steps(2,start) infinite}@keyframes blink{to{opacity:0}}
@media(prefers-reduced-motion:reduce){.scene,.cursor{animation:none}.scene0{opacity:1}.scene1,.scene2{opacity:0}}
</style></defs>
<rect x="1" y="1" width="958" height="234" rx="22" fill="#0d1117" stroke="#30363d"/>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#f0f6fc"><circle cx="29" cy="26" r="5" fill="#ff5f57"/><circle cx="48" cy="26" r="5" fill="#febc2e"/><circle cx="67" cy="26" r="5" fill="#28c840"/><text x="95" y="31" font-size="14" fill="#a3b1c2" font-weight="400" >ganesh@github  ~  /building</text><path d="M1 48H959" stroke="#30363d"/><g class="scene scene0"><text x="30" y="89" font-size="22" fill="#f07424" font-weight="600" font-family="monospace">$ whoami</text><text x="30" y="132" font-size="27" fill="#f0f6fc" font-weight="650" >Ganesh Kambli</text><text x="30" y="170" font-size="18" fill="#a3b1c2" font-weight="400" >AI Engineer at Flid AI. Curious about the systems underneath.</text></g><g class="scene scene1"><text x="30" y="89" font-size="22" fill="#f07424" font-weight="600" font-family="monospace">$ cat currently-building</text><text x="30" y="132" font-size="27" fill="#f0f6fc" font-weight="650" >LeapView / governed analytics as code</text><text x="30" y="170" font-size="18" fill="#a3b1c2" font-weight="400" >Go backends. DuckDB execution. Dashboards and AI agents.</text></g><g class="scene scene2"><text x="30" y="89" font-size="22" fill="#f07424" font-weight="600" font-family="monospace">$ ls projects/</text><text x="30" y="132" font-size="27" fill="#f0f6fc" font-weight="650" >LeapView   RepoSage   HoneyCloud</text><text x="30" y="170" font-size="18" fill="#a3b1c2" font-weight="400" >Analytics, local code intelligence, and threat telemetry.</text></g><rect class="cursor" x="30" y="195" width="10" height="18" fill="#f07424"/><text x="52" y="210" font-size="15" fill="#a3b1c2" font-weight="400" font-family="monospace">explore the projects below</text></g>
</svg>
